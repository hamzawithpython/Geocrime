services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geocrime-postgis
    environment:
      POSTGRES_DB: geocrime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geocrime_dev_password
    ports:
      - "5439:5432"
    volumes:
      - geocrime-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geocrime"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./agent
    container_name: geocrime-api
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env.docker
    volumes:
      - ./agent/models:/app/models
      - ./agent/data:/app/data
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  geocrime-postgis-data: